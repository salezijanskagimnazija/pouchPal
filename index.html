<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>pouchPal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="main">
    <div class="header">
      <div class="heading">
        <h1>PouchPal</h1>
      </div>
      <div class="statusBar">
        <div class="time">
          <p class="showTime">11:17</p>
          <p class="showDate">16.11.2026.</p>
        </div>
        < div class="arrangeScreen">
          <div class="arrangeButton">
            <button>O</button>
          </div>
        </div>
      </div>
    </div>
    <div class="info">
      <div class="XPBar">
      </div>
      <div class="character">
        <div class="characterImg">
        </div>
        <div class="characterName">
        </div>
        <div class="XPVisual">
        </div>
      </div>
    </div>
    <div class="steps">
      <div class="headingSteps">
      </div>
      <div class="visualSteps">
      </div>
    </div>
    <div class="interactive">
      <div class="buttons">
      </div>
      <div class="list">
      </div>
    </div>
  </div>
</body>
</html>
