<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>pouchPal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="main">
    <div class="header">
      <div class="heading">
        <h1>PouchPal</h1>
      </div>
      <div class="statusBar">
        <div class="time">
          <p class="showTime">11:17</p>
          <p class="showDate">16.11.2026.</p>
        </div>
        <div class="arrangeScreen">
          <div class="arrangeButton">
            <button>Change Screen</button>
          </div>
        </div>
      </div>
    </div>
    <div class="info">
      <h1>XP Bar</h1>
      <div class="XPBar">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSAXSkJhJ7BaA8V20y3r4z5gokPcXLSoKbSDjqCwN4kkw&s=10">
      </div>
      <div class="character">
        <h1>Pet screen</h1>
        <div class="characterImg">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTr5F9kjH6VbS9opyVxpfbXM8-9kzAhytbgmPDYQQkfSg&s=10">
        </div>
        <div class="characterName">
          <h3>Miško</h3>
        </div>
        </div>          
        </div>
        <div class="XPVisual">
        </div>
      </div>
    </div>
    <div class="steps">
      <h1>Steps Chart</h1>
      <div class="headingSteps">
      </div>
      <div class="visualSteps">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSwptDFlb74wKsm8KdSC-t2y6OePI-xijg5cSForahKUA&s=10">
      </div>
    </div>
    <div class="interactive">
      <div class="buttons">
        <button>To do list</button>
        <button>Water</button>
      </div>
      <div class="list">
      </div>
    </div>
  </div>
</body>
</html>
